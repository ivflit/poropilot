name: Deploy

# Deploys on every push to main — but only once you've turned it on by setting
# the repo variable DEPLOY_ENABLED = true (Settings → Secrets and variables →
# Actions → Variables) and adding the secrets below. Until then this job is
# skipped, so it never turns the build red.

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: ${{ vars.DEPLOY_ENABLED == 'true' }}
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            cd ${{ secrets.DEPLOY_PATH }}
            git pull --ff-only
            docker compose -f deploy/docker-compose.prod.yml up -d --build
