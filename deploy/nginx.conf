# Replace poropilot.example.com with your real domain before deploying.

# HTTP: serve the ACME challenge (for certbot renewals) and redirect the rest to HTTPS.
server {
    listen 80;
    server_name poropilot.example.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS: serve the built SPA and reverse-proxy the API to the backend container.
server {
    listen 443 ssl;
    server_name poropilot.example.com;

    ssl_certificate     /etc/letsencrypt/live/poropilot.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/poropilot.example.com/privkey.pem;

    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;   # SPA fallback
    }
}
